<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Practice</title>
    <style>
      img {
        max-width: 100%;
      }
      .card {
        width: 320px;
        box-shadow: 1px 1px 4px 1px #888;
        border-radius: 5px;
        background-color: white;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card span{
          margin: 8px 6px 6px 6px;
          float: right;
      }
      .card button{
          margin: 6px;
          background-color: white;
          border-radius: 3px;
          border: 1.5px solid darkgrey;
          padding: 3px 6px;
      }

      .card button:nth-of-type(1){
        border-radius: 3px 0 0 3px;
        margin-right: 0;
        border-right-width: 1px;
      }

      .card button:nth-of-type(2){
        border-radius: 0 3px 3px 0;
        margin-left: 0px;
        border-left-width: 1px;
      }

      .card button:active{
          border-color: black;
      }
      .card p{
          margin: 0 auto;
          padding: 15px;
      }
    </style>
  </head>
  <body>
    <article class="card">
      <img
        src="https://picsum.photos/320/240"
        alt="Random image from picsum.photos"
      />
      <p>
        This is a wider card with supported text below as a natural lead-in to additional content. This content is a little bit longer.
      </p>
      <footer>
        <button class="viewButton">View</button><button class="editButton">Edit</button>
        <span>9 mins</span>
      </footer>
    </article>
  </body>
</html>
